#START SET SELECTION
- type: entity
  id: ChaplainUndeterminedBible
  name: блюспейс-маяк писания
  description: Если я пойду и долиною смертной тени, не убоюсь зла, потому что Ты со мной.
  parent: [ BaseItem, BaseSetSelector ]
  components:
  - type: Sprite
    sprite: _ShitChap/Objects/scripturebeacon.rsi
    state: icon
  - type: SetSelector
    possibleSets:
    - BibleSet
    - QuaranSet
    - TanakhSet
    - ClockworkSet
    - BibleVedaSet
    - VelesBookSet
    maxSelectedSets: 1

- type: selectableSet
  id: BibleSet
  name: Святая Библия
  description: Разорви любые узы, кроме тех, что связывают меня с Твоим служением и Твоим сердцем.
  sprite:
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  content:
  - Bible

- type: selectableSet
  id: QuaranSet
  name: Коран
  description: Так какие же из благодеяний вашего Господа вы ˹люди и джинны˺ оба отвергаете?
  sprite:
    sprite: _Goobstation/Objects/Specific/Chapel/allah.rsi
    state: icon
  content:
  - BibleQuaran

- type: selectableSet
  id: TanakhSet
  name: Свитки Танаха
  description: Обучая, ты учишься сам.
  sprite:
    sprite: _Goobstation/Wizard/Objects/scroll.rsi
    state: scroll2
  content:
  - BibleTanakh

- type: selectableSet
  id: ClockworkSet
  name: Заводная Скрижаль
  description: Связь между тобой и Небесным Остовом. Содержит информацию, читает писания и является твоим самым важным инструментом как Служителя.
  sprite:
    sprite: _ShitChap/Objects/clockwork_slab.rsi
    state: icon
  content:
  - BibleSlabClockwork

- type: selectableSet
  id: BibleVedaSet
  name: Славяно-Арийские Веды
  description: Славянское неоязычество.
  sprite:
    sprite: _Goobstation/Objects/Specific/Chapel/veda.rsi
    state: icon
  content:
  - BibleVeda

- type: selectableSet
  id: VelesBookSet
  name: Велесова книга
  description: Основа и доказательство неоязыческой религиозности.
  sprite:
    sprite: _Goobstation/Objects/Specific/Chapel/veles_book.rsi
    state: icon
  content:
  - BibleVelesBook
##END SET SELECTION

- type: entity
  name: библия
  description: Новый Межзвёздный Перевод, версия 2340.
  parent: BaseStorageItem
  id: Bible
  components:
  - type: UseDelay
    delay: 10.0
  - type: Bible
    damage:
      groups:
        Brute: -15
        Burn: -15
    damageOnFail:
      groups:
        Brute: 15
        Airloss: 15
    damageOnUntrainedUse: ## What a non-chaplain takes when attempting to heal someone
      types:
        Heat: 10
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    damage:
      types:
        Holy: 5 # Goobstation - bro wtf
        Blunt: 1
  #- type: Prayable - no, use the altar
  #  bibleUserOnly: true
  - type: AlternatePrayable # Goobstation
    requireBibleUser: false
  - type: Summonable
    specialItem: SpawnPointGhostRemilia
  - type: ReactionMixer
    mixMessage: "bible-mixing-success"
    reactionTypes:
    - Holy
  - type: Sprite
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Objects/Specific/Chapel/bible.rsi
  - type: Clothing
    slots:
    - Belt
  - type: Storage
    grid:
    - 0,0,0,1
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Material
  #  - type: Tag
  #    tags:
  #    - Bible
  #  - type: StealTarget
  #    stealGroup: Bible
  - type: EnchantingTool # Goobstation
  - type: StatusEffectOnCollideGhost # Goobstation
    whitelist:
      tags:
      - WeakToSalt
    statusEffect: Corporeal
    duration: 5

- type: entity
  parent: [Bible]
  name: necronomicon
  description: "There's a note: Klatuu, Verata, Nikto -- Don't forget it again!"
  id: BibleNecronomicon
  components:
  - type: Bible
    damage:
      types:
        Caustic: 20 ## ~15 dps
    damageOnFail:
      groups:
        Brute: 15
        Airloss: 25
    damageOnUntrainedUse:
      types:
        Caustic: 50
    failChance: 0
    locPrefix: "necro"
    healSound: "/Audio/Effects/lightburn.ogg"
  - type: Summonable
    specialItem: SpawnPointGhostCerberus
    respawnTime: 300
  - type: Sprite
    sprite: Objects/Specific/Chapel/necronomicon.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/necronomicon.rsi

- type: entity
  parent: BaseAction
